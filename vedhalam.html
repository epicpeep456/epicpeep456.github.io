   Tamil Nadu locations. A ghost hints at its hiding spot with a
   template sentence + a location word. Find it before the

/* ---------------- Difficulty ---------------- */
const ROUNDS_PER_NIGHT = 3;
const DRAIN_BASE = 3.2;
const DRAIN_PER_NIGHT = 0.9;
const WRONG_PENALTY = 9;
const QUESTION_TIME = 16;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickClue(locId, night) {
  const matches = CLUES.filter((c) => c.locations.includes(locId));
  const ambiguous = matches.filter((c) => c.locations.length > 1);
  const unambiguous = matches.filter((c) => c.locations.length === 1);
  const ambiguousChance = Math.min(0.85, 0.2 + night * 0.2);
  let pool;
  if (ambiguous.length && Math.random() < ambiguousChance) pool = ambiguous;
  else if (unambiguous.length) pool = unambiguous;
  else pool = matches;
  return pool[Math.floor(Math.random() * pool.length)];
}

function pickStory(locId) {
  const arr = STORIES[locId];
  return arr[Math.floor(Math.random() * arr.length)];
}

function buildQuestionOptions(story) {
  const options = shuffle([story.correctAnswer, ...story.wrongAnswers]);
  const correctIndex = options.indexOf(story.correctAnswer);
  return { options, correctIndex };
}

function randomLocationId() {
  return LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)].id;
}

function makeRound(night, round, prevLives, prevScore) {
  const ghostLocation = randomLocationId();
  return {
    night,
    round,
    lives: prevLives,
    score: prevScore,
    power: 100,
    ghostLocation,
    viewedLocation: null,
    clue: pickClue(ghostLocation, night),
    checkedWrong: [],
    phase: "search", // search | reveal | story | question | jumpscare
    story: null,
    questionOptions: null,
    correctIndex: null,
    questionTimeLeft: QUESTION_TIME,
    flash: null,
  };
}

function TamilGhostHunt() {
  const [screen, setScreen] = useState("start"); // start | playing | win | lose
  const [game, setGame] = useState(() => makeRound(1, 1, 3, 0));
  const flashTimeout = useRef(null);

  const startNight = useCallback((night, lives = 3, score = 0) => {
    setGame(makeRound(night, 1, lives, score));
    setScreen("playing");
  }, []);

  /* --- power drain while searching --- */
  useEffect(() => {
    if (screen !== "playing" || game.phase !== "search") return;
    const id = setInterval(() => {
      setGame((prev) => {
        if (prev.phase !== "search") return prev;
        const drain = DRAIN_BASE + prev.night * DRAIN_PER_NIGHT;
        const power = prev.power - drain;
        if (power <= 0) {
          return { ...prev, power: 0, phase: "jumpscare", viewedLocation: prev.ghostLocation };
        }
        return { ...prev, power };
      });
    }, 1000);
    return () => clearInterval(id);
  }, [screen, game.phase]);

  /* --- jumpscare resolution --- */
  useEffect(() => {
    if (game.phase !== "jumpscare") return;
    const t = setTimeout(() => {
      setGame((prev) => {
        const lives = prev.lives - 1;
        if (lives <= 0) {
          setScreen("lose");
          return prev;
        }
        return makeRound(prev.night, prev.round, lives, prev.score);
      });
    }, 1500);
    return () => clearTimeout(t);
  }, [game.phase]);

  /* --- question countdown --- */
  useEffect(() => {
    if (screen !== "playing" || game.phase !== "question") return;
    const id = setInterval(() => {
      setGame((prev) => {
        if (prev.phase !== "question") return prev;
        const t = prev.questionTimeLeft - 1;
        if (t <= 0) {
          return prev; // let the effect below handle resolution
        }
        return { ...prev, questionTimeLeft: t };
      });
    }, 1000);
    return () => clearInterval(id);
  }, [screen, game.phase]);

  useEffect(() => {
    if (game.phase === "question" && game.questionTimeLeft <= 0) {
      handleAnswer(-1);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [game.questionTimeLeft, game.phase]);

  /* --- clear transient flash --- */
  useEffect(() => {
    if (!game.flash) return;
    clearTimeout(flashTimeout.current);
    flashTimeout.current = setTimeout(() => {
      setGame((g) => ({ ...g, flash: null }));
    }, 1400);
    return () => clearTimeout(flashTimeout.current);
  }, [game.flash]);

  const handleSearch = (locId) => {
    if (game.phase !== "search") return;
    if (game.checkedWrong.includes(locId)) return;

    if (locId === game.ghostLocation) {
      setGame((prev) => ({ ...prev, viewedLocation: locId, phase: "reveal" }));
      setTimeout(() => {
        setGame((prev) => ({ ...prev, phase: "story", story: pickStory(prev.ghostLocation) }));
      }, 1000);
    } else {
      setGame((prev) => ({
        ...prev,
        viewedLocation: locId,
        power: Math.max(0, prev.power - WRONG_PENALTY),
        checkedWrong: [...prev.checkedWrong, locId],
        flash: { text: "வேதா இங்கு இல்லை — Not here", kind: "bad" },
      }));
    }
  };

  const proceedToQuestion = () => {
    setGame((prev) => {
      const { options, correctIndex } = buildQuestionOptions(prev.story);
      return { ...prev, phase: "question", questionOptions: options, correctIndex, questionTimeLeft: QUESTION_TIME };
    });
  };

  const handleAnswer = (idx) => {
    setGame((prev) => {
      if (prev.phase !== "question") return prev;
      const correct = idx === prev.correctIndex;
      if (correct) {
        const score = prev.score + 20 * prev.night;
        if (prev.round >= ROUNDS_PER_NIGHT) {
          setScreen("win");
          return { ...prev, score };
        }
        return makeRound(prev.night, prev.round + 1, prev.lives, score);
      } else {
        const lives = prev.lives - 1;
        if (lives <= 0) {
          setScreen("lose");
          return prev;
        }
        return makeRound(prev.night, prev.round, lives, prev.score);
      }
    });
  };

  return (
    <div className="vv-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Noto+Sans+Tamil:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
          --bg-deep: #0f1420;

          --lamp-gold: #e8b04b;

          --kumkum-glow: #ff6b57;

          --bone-dim: #b8ae98;
        }

          justify-content: center;

          box-sizing: border-box;
        }
        .vv-root * { box-sizing: border-box; }

        .vv-shell { width: 100%; max-width: 860px; }
        .vv-title { font-family: 'Noto Serif Tamil', serif; font-weight: 700; letter-spacing: 0.02em; }

        /* ---------- Start / end cards ---------- */
        .start-card {
          background: linear-gradient(180deg, var(--bg-panel), var(--bg-deep));
          border: 1px solid #33405a;
          border-radius: 14px;
          padding: 40px 32px;
          text-align: center;
          box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 60px rgba(232,176,75,0.04);
          position: relative;
          overflow: hidden;
        }
        .start-title { font-size: 2.2em; color: var(--lamp-gold); margin: 0 0 4px; text-shadow: 0 0 24px rgba(232,176,75,0.35); }
        .start-sub {

        }
        .vv-divider { width: 60px; height: 3px; margin: 16px auto; background: var(--kumkum); border-radius: 2px; }
        .rules { text-align: left; max-width: 520px; margin: 0 auto 24px; font-size: 0.95em; line-height: 1.65; color: var(--bone-dim); }
        .rules b { color: var(--bone); }

        .vv-btn {
          font-family: 'Noto Sans Tamil', sans-serif; font-weight: 600; font-size: 1.02em;
          padding: 13px 30px; border-radius: 8px; border: 1px solid var(--lamp-gold);
          background: linear-gradient(180deg, #3a3018, #241d0e); color: var(--lamp-gold);
          cursor: pointer; letter-spacing: 0.02em; transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        /* ---------- HUD ---------- */
        .hud {

        /* ---------- Lamp bar ---------- */

        .clue-panel {

        .flash-msg {

        .speech-bubble {

          font-family: 'Noto Serif Tamil', serif; font-size: 0.95em; white-space: nowrap;
        }

        /* ---------- Jumpscare ---------- */
        .jumpscare-overlay {
          position: absolute; inset: 0; background: #1a0303; display: flex; align-items: center; justify-content: center;
          z-index: 20; animation: shake 0.12s infinite;
        }
        @keyframes shake { 0%{transform:translate(0,0);} 25%{transform:translate(-3px,2px);} 50%{transform:translate(3px,-2px);} 75%{transform:translate(-2px,-3px);} 100%{transform:translate(2px,3px);} }
        .jumpscare-text {
          font-family: 'Noto Serif Tamil', serif; font-size: 2em; color: var(--kumkum-glow);
          text-shadow: 0 0 20px var(--kumkum-glow);
        }

        /* ---------- Story / question modal ---------- */
        .story-overlay {
          position: absolute; inset: 0; background: rgba(6,5,3,0.92); display: flex; align-items: center;
          justify-content: center; z-index: 10; padding: 14px;
        }
        .story-card {
          background: linear-gradient(180deg, #241d10, #171208); border: 2px solid var(--lamp-gold);
          border-radius: 12px; padding: 18px 20px; width: 100%; max-width: 480px; text-align: left;
        }
        .story-warn { font-family: 'JetBrains Mono', monospace; color: var(--lamp-gold); font-size: 0.72em; letter-spacing: 0.1em; margin-bottom: 10px; text-align: center; }
        .story-tamil { font-family: 'Noto Serif Tamil', serif; font-size: 1.15em; color: var(--bone); line-height: 1.6; margin-bottom: 8px; }
        .story-translit { color: var(--bone-dim); font-size: 0.82em; font-style: italic; line-height: 1.5; margin-bottom: 8px; }
        .story-english { color: var(--bone-dim); font-size: 0.85em; line-height: 1.5; margin-bottom: 14px; }
        .story-q { font-family: 'Noto Serif Tamil', serif; font-size: 1.1em; color: var(--lamp-gold); text-align: center; margin-bottom: 2px; }
        .story-q-en { font-family: 'JetBrains Mono', monospace; font-size: 0.72em; color: var(--bone-dim); text-align: center; margin-bottom: 14px; }
        .story-timer-wrap { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
        .story-timer-fill { height: 100%; background: var(--kumkum); transition: width 1s linear; }
        .story-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .story-opt {
          font-family: 'Noto Sans Tamil', sans-serif; padding: 11px 8px; border-radius: 8px; border: 1px solid #4a3a22;
          background: #2c2414; color: var(--bone); cursor: pointer; font-size: 0.85em; text-align: center;
        }
        .story-opt:hover { border-color: var(--lamp-gold); }

        .end-stats { font-family: 'JetBrains Mono', monospace; color: var(--bone-dim); margin: 16px 0; line-height: 1.8; }
        .end-stats b { color: var(--lamp-gold); }

        @media (max-width: 560px) {
          .loc-tab { flex: 1 1 30%; }
        }
      `}</style>

      <div className="vv-shell">
        {screen === "start" && (
          <div className="start-card">
            <div className="start-title vv-title">பேயைத் தேடு</div>
            <div className="start-sub">Find the Ghost — A Tamil Vocabulary Hunt</div>
            <div className="vv-divider" />
            <div className="rules">
              <p>
                A <b>பேய்</b> (ghost) is hiding somewhere in the village — the forest, the palace, a tea
                shop, a bedroom, the market, the temple, or one of six more medieval spots. It calls out
                a hint sentence using a word tied to its hiding place.
              </p>
              <p>
                Tap the location you think it's in from the bar at the top. Some hints could fit more
                than one place — think carefully, because every wrong guess burns your lamp faster!
              </p>
              <p>
                Find it before the lamp goes dark, or it'll jump out and startle you. Once found, it'll
                tell you a short <b>kadhai</b> (story) — answer the question correctly to send it fleeing
                and move to the next hiding spot.
              </p>
              <p className="rules-tamil">
                🪔 விளக்கு அணைந்தால் பேய் திடீரென்று வருவான். மூன்று உயிர்கள் மட்டுமே உள்ளன!
              </p>
              <p>
                Clear <b>3 nights</b> and you'll have chased it away for good.
              </p>
            </div>
            <button className="vv-btn" onClick={() => startNight(1)}>
              தேடத் தொடங்கு · Start Searching
            </button>
          </div>
        )}

        {screen === "playing" && (
          <PlayingScreen
            game={game}
            onSearch={handleSearch}
            onProceedToQuestion={proceedToQuestion}
            onAnswer={handleAnswer}
          />
        )}

        {screen === "win" && game.night >= 3 && (
          <div className="start-card">
            <div className="start-title vv-title" style={{ color: "var(--lamp-gold)" }}>
              பேயை விரட்டியடித்தாய்! 🎉
            </div>
            <div className="start-sub">You chased the ghost away for good — you win!</div>
            <div className="vv-divider" />
            <div className="rules" style={{ textAlign: "center" }}>
              <p>
                Three nights of quick thinking and sharp ears, and the ghost has finally given up on this
                village. It won't be back.
              </p>
            </div>
            <div className="end-stats">
              Final score: <b>{game.score}</b>
              <br />
              Lives remaining: <b>{game.lives}</b>
            </div>
            <button className="vv-btn" onClick={() => startNight(game.night + 1, 3, game.score)}>
              இன்னும் விளையாடு · Keep Playing for a Higher Score
            </button>{" "}
            <button className="vv-btn secondary" onClick={() => setScreen("start")}>
              நிறுத்து · Stop here
            </button>
          </div>
        )}

        {screen === "win" && game.night < 3 && (
          <div className="start-card">
            <div className="start-title vv-title" style={{ color: "var(--lamp-gold)" }}>
              வெற்றி! 🏆
            </div>
            <div className="start-sub">You survived Night {game.night}</div>
            <div className="vv-divider" />
            <div className="end-stats">
              Score: <b>{game.score}</b>
              <br />
              Lives remaining: <b>{game.lives}</b>
            </div>
            <button className="vv-btn" onClick={() => startNight(game.night + 1, 3, game.score)}>
              அடுத்த இரவு · Next Night ({game.night + 1})
            </button>{" "}
            <button className="vv-btn secondary" onClick={() => setScreen("start")}>
              நிறுத்து · Stop here
            </button>
          </div>
        )}

        {screen === "lose" && (
          <div className="start-card">
            <div className="start-title vv-title" style={{ color: "var(--kumkum-glow)" }}>
              பேய் வென்றது! 👻
            </div>
            <div className="start-sub">Night {game.night} ends here</div>
            <div className="vv-divider" />
            <div className="end-stats">
              Final score: <b>{game.score}</b>
            </div>
            <button className="vv-btn" onClick={() => startNight(1)}>
              மீண்டும் முயற்சி · Try Again
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function PlayingScreen({ game, onSearch, onProceedToQuestion, onAnswer }) {
  const low = game.power < 30;
  const fitCount = game.clue.locations.length;

  return (
    <div>
      <div className="hud">
        <div className="hud-item">
          இரவு <b>{game.night}</b> · சுற்று <b>{game.round}/{ROUNDS_PER_NIGHT}</b>
        </div>
        <div className="hud-item">
          <span>உயிர்</span>
          <div className="lives">
            {[0, 1, 2].map((i) => (
              <div key={i} className={`tilak ${i < game.lives ? "" : "lost"}`} />
            ))}
          </div>
        </div>
        <div className="hud-item">
          மதிப்பெண் <b>{game.score}</b>
        </div>
      </div>

      <div className="lamp-row">
        <LampIcon low={low} />
        <div className="lamp-bar-wrap">
          <div className="lamp-bar-fill" style={{ width: `${game.power}%` }} />
        </div>
        <div className={`lamp-pct ${low ? "low" : ""}`}>{Math.round(game.power)}%</div>
      </div>

      <div className="clue-panel">
        <div className="clue-label">பேய் கூவுகிறது — THE GHOST CALLS OUT</div>
        <div className="clue-sentence">
          {game.clue.template} {game.clue.word}
        </div>
        <div className="clue-translit">
          {game.clue.templateTranslit} {game.clue.translit}
        </div>
        <div className="clue-fit">
          {fitCount > 1 ? `இது ${fitCount} இடங்களில் பொருந்தும்` : "இது ஒரே இடத்திற்குப் பொருந்தும்"}
        </div>
      </div>

      <div className="loc-bar">
        {LOCATIONS.map((loc) => {
          const isWrong = game.checkedWrong.includes(loc.id);
          return (
            <div
              key={loc.id}
              className={`loc-tab ${isWrong ? "wrong" : ""} ${game.phase !== "search" ? "disabled" : ""}`}
              onClick={() => onSearch(loc.id)}
            >
              <span className="lt-tamil">{loc.tamil}</span>
            </div>
          );
        })}
      </div>

      <div className="viewport">
        <div className="scene-tag">
          {game.viewedLocation
            ? `● ${LOCATIONS.find((l) => l.id === game.viewedLocation).tamil}`
            : "● NIGHT WATCH"}
        </div>
        {game.flash && <div className="flash-msg">{game.flash.text}</div>}
        <div key={game.viewedLocation || "none"} className="scene-fade">
          <SceneArt locId={game.viewedLocation} showGhost={game.phase !== "search"} />
        </div>
        {game.phase === "reveal" && (
          <div className="speech-bubble">என்னைக் கண்டுபிடித்தாய்!</div>
        )}
        {game.phase === "jumpscare" && (
          <div className="jumpscare-overlay">
            <div className="jumpscare-text">பேய்! 👻</div>
          </div>
        )}
      </div>

      {game.phase === "story" && game.story && (
        <StoryModal story={game.story} onNext={onProceedToQuestion} />
      )}
      {game.phase === "question" && game.story && game.questionOptions && (
        <QuestionModal story={game.story} options={game.questionOptions} timeLeft={game.questionTimeLeft} onAnswer={onAnswer} />
      )}
    </div>
  );
}

function SceneArt({ locId, showGhost }) {
  const loc = LOCATIONS.find((l) => l.id === locId);
  return (
    <svg width="100%" height="100%" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" style={{ position: "absolute", inset: 0 }}>
      <defs>
        <linearGradient id="sceneGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={loc ? loc.accent2 : "#0f1420"} />
          <stop offset="100%" stopColor="#05070c" />
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill="url(#sceneGrad)" />
      {loc ? (
        <LocationDecor id={locId} accent={loc.accent} />
      ) : (
        <text x="200" y="134" textAnchor="middle" fill="#5a6580" fontSize="13" fontFamily="'JetBrains Mono', monospace" letterSpacing="1">
